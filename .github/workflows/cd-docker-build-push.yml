name: Docker Build and Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Newest patch release of each CUDA major line as of writing; bump these
        # by hand when a newer 12.x/13.x release lands. cuda_version is unused
        # for Dockerfile.cpu (image-configs.sh falls back to its own default).
        include:
          - dockerfile: "Dockerfile.cpu"
            cuda_version: ""
          - dockerfile: "Dockerfile.cuda"
            cuda_version: "12.9.2"
          - dockerfile: "Dockerfile.cuda"
            cuda_version: "13.3.0"

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        env:
          CUDA_VERSION: ${{ matrix.cuda_version }}
        run: |
          IMAGE_NAME=$(bash ./scripts/build.sh "${{ matrix.dockerfile }}")
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push Docker image
        run: docker image push "${{ env.IMAGE_NAME }}"